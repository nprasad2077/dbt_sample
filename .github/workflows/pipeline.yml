name: Update NBA Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v4

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip duckdb.zip && sudo mv duckdb /usr/local/bin/

      - name: Run pipeline
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: ./scripts/pipeline.sh

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/DB/dbt_nba.duckdb dbt_nba/reports/sources/nba/dbt_nba.duckdb
          git diff --cached --quiet || git commit -m "Update DuckDB [automated]"
          git push
